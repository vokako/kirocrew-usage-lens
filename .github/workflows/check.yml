name: check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    # The backend is stdlib-only and runs inside whatever interpreter the user's
    # gateway has, so it is tested across the range rather than on one version.
    # 3.9 is the floor: `zoneinfo` arrives there, and it is the version that does
    # NOT accept a `Z`-suffixed timestamp in `fromisoformat` — the reason the
    # reader normalises one itself.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.9', '3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Assert no third-party imports crept into the backend
        run: |
          python3 - <<'PY'
          import ast, pathlib, sys
          allowed = {
              # stdlib the backend is allowed to use
              '__future__', 'argparse', 'asyncio', 'collections', 'contextlib', 'datetime',
              'json', 'logging', 'math', 'os', 'pathlib', 're', 'stat', 'sys', 'tempfile',
              'time', 'typing', 'unittest', 'zoneinfo',
              # the gateway's own runtime, which the app runs inside
              'aiohttp', 'kiro_crew',
              # this package
              'usage_store',
          }
          bad = []
          for path in pathlib.Path('backend').glob('*.py'):
              tree = ast.parse(path.read_text())
              for node in ast.walk(tree):
                  if isinstance(node, ast.Import):
                      names = [a.name.split('.')[0] for a in node.names]
                  elif isinstance(node, ast.ImportFrom):
                      names = [(node.module or '').split('.')[0]]
                  else:
                      continue
                  for name in names:
                      if name and name not in allowed:
                          bad.append(f'{path}:{node.lineno}: {name}')
          if bad:
              print('\n'.join(bad)); sys.exit(1)
          print('backend imports are stdlib + aiohttp + kiro_crew only')
          PY
      - run: python3 -m unittest discover -s tests -v

  frontend:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - name: Assert the committed ui/index.mjs matches src/
        # ui/index.mjs is a TRACKED build artifact: the dashboard loads it directly,
        # so a stale one ships a page that does not match the source in the repo.
        run: git diff --exit-code -- ui/index.mjs
      - name: Frontend tests (synthetic fixture — CI has no usage shards)
        run: |
          python3 tests/fixture.py
          node --test tests/frontend.test.mjs

  assets:
    # The icon, the manifest, and the registry index are loaded by the dashboard
    # directly rather than through any code of ours, and a malformed SVG fails
    # SILENTLY as a broken-image placeholder — so they get their own assertions.
    # tests/test_assets.py is the single source of truth; this job just runs it on a
    # bare checkout, without the frontend toolchain.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python3 -m unittest tests.test_assets -v
        env:
          PYTHONPATH: .
