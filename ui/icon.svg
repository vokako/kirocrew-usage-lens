<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"
     fill="none" role="img" aria-label="Usage Lens">
  <!--
    House style, taken from the other app icons: a 24x24 box, fill="none", a single
    neutral stroke colour, 1.5-1.6 weight, round caps, and few enough shapes to read
    at the 16px the sidebar renders it at.

    One motif rather than two: the bars sit INSIDE the lens, so at 16px the shape
    reads as a single object instead of a small chart with something next to it.

    The colour is HARDCODED rather than `currentColor` on purpose. The dashboard
    mounts a page icon as <img src="/apps/<name>/ui/icon.svg">, and an <img> is a
    separate document — it inherits no colour from the page, so `currentColor`
    resolved to black and the icon all but vanished on a dark sidebar. #737A8C is the
    same grey the other third-party app icon uses.
  -->
  <circle cx="10.5" cy="10.5" r="6.6" stroke="#737A8C" stroke-width="1.5"/>
  <path d="M7.9 12.9v-2M10.5 12.9V7.6M13.1 12.9v-3.4"
        stroke="#737A8C" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M15.6 15.6 20.4 20.4" stroke="#737A8C" stroke-width="1.7" stroke-linecap="round"/>
</svg>
