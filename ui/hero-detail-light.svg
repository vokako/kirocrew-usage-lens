<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 288" width="1200" height="288"
     role="img" aria-label="Usage Lens">
  <!--
    25:6 banner for the detail page, at the 1200x288 the first-party detail art uses.
    A banner is much wider than tall, so the composition is not the hero scaled down:
    the chart runs the full width and the lens sits left of centre, where the detail
    page's own text does not cover it.
  -->
  <defs>
    <linearGradient id="bbg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f4f0fe"/>
      <stop offset="100%" stop-color="#e2d8f8"/>
    </linearGradient>
    <linearGradient id="bbar" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#a97bff"/>
    </linearGradient>
    <clipPath id="bLens"><circle cx="300" cy="150" r="82"/></clipPath>
  </defs>

  <rect width="1200" height="288" fill="url(#bbg)"/>
  <circle cx="86" cy="52" r="30" fill="#c4b5fd" opacity="0.40"/>
  <circle cx="1108" cy="236" r="44" fill="#b69bfa" opacity="0.30"/>

  <g fill="#8b93a7" opacity="0.34">
    <rect x="96" y="196" width="18" height="38" rx="5"/>
    <rect x="128" y="174" width="18" height="60" rx="5"/>
    <rect x="160" y="204" width="18" height="30" rx="5"/>
    <rect x="192" y="160" width="18" height="74" rx="5"/>
    <rect x="224" y="186" width="18" height="48" rx="5"/>
    <rect x="256" y="140" width="18" height="94" rx="5"/>
    <rect x="288" y="118" width="18" height="116" rx="5"/>
    <rect x="320" y="152" width="18" height="82" rx="5"/>
    <rect x="352" y="104" width="18" height="130" rx="5"/>
    <rect x="384" y="168" width="18" height="66" rx="5"/>
    <rect x="416" y="190" width="18" height="44" rx="5"/>
    <rect x="448" y="146" width="18" height="88" rx="5"/>
    <rect x="480" y="178" width="18" height="56" rx="5"/>
    <rect x="512" y="126" width="18" height="108" rx="5"/>
    <rect x="544" y="198" width="18" height="36" rx="5"/>
    <rect x="576" y="164" width="18" height="70" rx="5"/>
    <rect x="608" y="136" width="18" height="98" rx="5"/>
    <rect x="640" y="182" width="18" height="52" rx="5"/>
    <rect x="672" y="112" width="18" height="122" rx="5"/>
    <rect x="704" y="156" width="18" height="78" rx="5"/>
    <rect x="736" y="192" width="18" height="42" rx="5"/>
    <rect x="768" y="132" width="18" height="102" rx="5"/>
    <rect x="800" y="170" width="18" height="64" rx="5"/>
    <rect x="832" y="144" width="18" height="90" rx="5"/>
    <rect x="864" y="186" width="18" height="48" rx="5"/>
    <rect x="896" y="122" width="18" height="112" rx="5"/>
    <rect x="928" y="160" width="18" height="74" rx="5"/>
    <rect x="960" y="194" width="18" height="40" rx="5"/>
    <rect x="992" y="138" width="18" height="96" rx="5"/>
    <rect x="1024" y="176" width="18" height="58" rx="5"/>
  </g>
  <rect x="90" y="236" width="980" height="2" rx="1" fill="#8b93a7" opacity="0.30"/>

  <g clip-path="url(#bLens)">
    <circle cx="300" cy="150" r="82" fill="#ffffff" opacity="0.72"/>
    <g fill="url(#bbar)">
      <rect x="256" y="140" width="18" height="94" rx="5"/>
      <rect x="288" y="118" width="18" height="116" rx="5"/>
      <rect x="320" y="152" width="18" height="82" rx="5"/>
      <rect x="352" y="104" width="18" height="130" rx="5"/>
    </g>
    <rect x="222" y="236" width="160" height="2" rx="1" fill="#7c3aed" opacity="0.45"/>
  </g>

  <circle cx="300" cy="150" r="82" fill="none" stroke="#6b7280" stroke-width="8"/>
  <circle cx="300" cy="150" r="75" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.55"/>
  <path d="M359 209 L404 254" stroke="#6b7280" stroke-width="14" stroke-linecap="round"/>
</svg>
